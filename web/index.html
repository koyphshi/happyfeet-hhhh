<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mars · step 1 · globe with Gale imagery</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./node_modules/cesium/Build/Cesium/Widgets/widgets.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #cesiumContainer { position: absolute; inset: 0; }
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 5; width: 290px; max-height: calc(100% - 60px);
      overflow: auto; padding: 10px 12px; background: rgba(15, 15, 15, 0.86); color: #eee;
      border-radius: 8px; font: 13px/1.4 system-ui, sans-serif;
    }
    #panel h1 { font-size: 14px; margin: 0 0 8px; }
    .layer { margin: 0 0 9px; padding-bottom: 8px; border-bottom: 1px solid #333; }
    .layer label { display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .layer input[type=range] { width: 100%; margin: 4px 0 0; }
    .layer .note { color: #aaa; font-size: 11.5px; margin-top: 2px; }
    .sub { margin: 6px 0 3px; color: #bbb; }
    #places button { margin: 2px 4px 2px 0; padding: 3px 8px; cursor: pointer; }
    #spots { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 4px 0 8px; }
    #spots button { min-width: 0; padding: 5px 6px; text-align: left; cursor: pointer; background: #242424; color: #ddd; border: 1px solid #444; border-radius: 4px; }
    #spots button:hover, #spots button.active { border-color: #e8b85a; background: #332d20; }
    #spotControls { display: flex; align-items: center; justify-content: space-between; }
    #spotToggle { padding: 2px 7px; font-size: 11px; cursor: pointer; background: #242424; color: #ccc; border: 1px solid #444; border-radius: 4px; }
    #spotToggle.on { color: #ffe0a0; border-color: #8c6b2e; }
    #spotFilters { display: grid; gap: 5px; margin: 3px 0 6px; }
    #spotSearch, #spotCategory { min-width: 0; padding: 4px 6px; background: #1f1f1f; color: #eee; border: 1px solid #444; border-radius: 4px; font: 12px system-ui, sans-serif; }
    #spotTagFilters, #spotTags { display: flex; flex-wrap: wrap; gap: 4px; }
    .spotTagFilter, .spotTag { padding: 1px 6px; border: 1px solid #444; border-radius: 10px; color: #bbb; background: #252525; font-size: 10px; }
    .spotTagFilter { cursor: pointer; }
    .spotTagFilter.on { border-color: #a7864d; color: #ffe0a0; background: #332d20; }
    #spotFilterCount { color: #888; font-size: 10px; text-align: right; }
    .spotBadge { float: right; color: #f0d18e; font-size: 9px; }
    #spotCard { position: absolute; z-index: 7; transform: translate(-50%, calc(-100% - 18px)); width: min(320px, calc(100vw - 24px));
      padding: 9px 10px; border: 1px solid #75613a; border-radius: 7px; background: rgba(18, 18, 17, .95);
      box-shadow: 0 5px 22px rgba(0, 0, 0, .65); color: #eee; pointer-events: auto; }
    #spotCard[hidden] { display: none; }
    #spotCard .spotHead { display: flex; align-items: center; gap: 6px; }
    #spotCard h2 { flex: 1; font-size: 13px; margin: 0 0 3px; color: #ffe082; }
    #spotCard .spotHead button { padding: 0 5px; cursor: pointer; color: #ccc; background: #242424; border: 1px solid #444; border-radius: 3px; }
    #spotCard .spotType, #spotCard .spotNote { color: #bbb; font-size: 11.5px; }
    #spotImage { display: block; width: 100%; max-height: 170px; margin-top: 7px; object-fit: cover; border-radius: 4px; background: #111; }
    #spotImage[hidden], #spotImageCaption[hidden], #spotVrButton[hidden] { display: none; }
    #spotImageCaption { margin-top: 2px; color: #888; font-size: 10px; }
    #spotVrButton { margin-top: 7px; padding: 5px 8px; cursor: pointer; background: #332d20; color: #ffe0a0; border: 1px solid #927441; border-radius: 4px; }
    #spotStats { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 8px; margin-top: 6px; font: 11px ui-monospace, Consolas, monospace; }
    #spotStats span:nth-child(odd) { color: #aaa; }
    #readout { margin-top: 8px; color: #9fd3ff; font: 12px ui-monospace, Consolas, monospace; }
    #status { margin-top: 6px; color: #f0b27a; min-height: 1.4em; font-size: 12px; }
    .hint { color: #888; font-size: 11.5px; margin-top: 6px; }
    #view button, #cache button { margin: 2px 4px 2px 0; padding: 3px 8px; cursor: pointer; }
    #view button.on { background: #2f6fb3; color: #fff; border-color: #2f6fb3; }
    #tiltRow { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    #tiltRow input { flex: 1; }
    #reliefRow { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    #reliefRow label { white-space: nowrap; }
    #reliefRow input[type=range] { flex: 1; }
    #terrainNote { color: #aaa; font-size: 11.5px; margin-top: 2px; }
    #ground { color: #c9e7a7; font: 12px ui-monospace, Consolas, monospace; min-height: 1.3em; }
    #readout, #scale .dist { white-space: pre; }
    #cacheInfo { color: #aaa; font-size: 11.5px; }
    /* scale bar, bottom right, above the credits */
    #scale {
      position: absolute; right: 16px; bottom: 34px; z-index: 5; padding: 5px 8px 4px;
      background: rgba(15, 15, 15, 0.78); color: #eee; border-radius: 6px;
      font: 12px ui-monospace, Consolas, monospace; text-align: center; pointer-events: none;
    }
    #scaleBar { height: 6px; margin: 3px auto 0; border: 2px solid #eee; border-top: none; }
    #scale .dist { color: #9fd3ff; margin-top: 4px; font-size: 11.5px; text-align: left; }

    /* active layer rows */
    .layer .head { display: flex; align-items: center; gap: 4px; }
    .layer .head label { flex: 1; min-width: 0; }
    .layer .head label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .layer .head button {
      padding: 0 5px; font-size: 11px; line-height: 17px; cursor: pointer; background: #2a2a2a;
      color: #ccc; border: 1px solid #444; border-radius: 3px;
    }
    .layer .head button:hover { background: #3a3a3a; color: #fff; }
    .layer .note.err { color: #ff8a80; }

    /* layer picker: category dropdown + search box + results list */
    #picker { margin: 2px 0 10px; }
    #pickRow { display: flex; gap: 4px; }
    #layerCat, #layerSearch {
      background: #1f1f1f; color: #eee; border: 1px solid #444; border-radius: 4px;
      font: 12.5px system-ui, sans-serif; padding: 4px 6px;
    }
    #layerCat { width: 104px; }
    #layerSearch { flex: 1; min-width: 0; }
    #layerSearch:focus, #layerCat:focus { outline: 1px solid #2f6fb3; border-color: #2f6fb3; }
    #pickOpts { display: flex; justify-content: space-between; color: #aaa; font-size: 11.5px; margin-top: 3px; }
    #pickOpts label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    #results {
      max-height: 280px; overflow: auto; margin-top: 4px; background: #181818;
      border: 1px solid #3a3a3a; border-radius: 4px;
    }
    #results .grp {
      position: sticky; top: 0; padding: 3px 7px; background: #262626; color: #9fd3ff;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    #results .item { padding: 4px 7px; cursor: pointer; border-top: 1px solid #222; }
    #results .item:hover, #results .item.hl { background: #23384f; }
    #results .item.added { opacity: 0.5; cursor: default; }
    #results .item .t { font-size: 12.5px; }
    #results .item .m { color: #999; font-size: 11px; }
    #results .item .badge {
      display: inline-block; padding: 0 4px; margin-left: 4px; border-radius: 3px; font-size: 10px;
      background: #2e4a2e; color: #b6e3a8; vertical-align: 1px;
    }
    #results .item .badge.reg { background: #4a3a22; color: #f0c98a; }
    #results .empty { padding: 8px; color: #999; font-size: 12px; }

    /* click-a-point readout, pinned above the clicked spot */
    #probe {
      position: absolute; z-index: 6; transform: translate(-50%, calc(-100% - 12px)); min-width: 220px;
      max-width: 460px; padding: 7px 9px 8px; background: rgba(12, 12, 12, 0.92); color: #eee;
      border: 1px solid #555; border-radius: 6px; font: 12px/1.45 ui-monospace, Consolas, monospace;
      pointer-events: auto; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    #probe::after { /* pointer to the spot */
      content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -6px;
      border: 6px solid transparent; border-bottom: 0; border-top-color: #555;
    }
    #probe .top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; color: #9fd3ff; }
    #probe .top span { flex: 1; }
    #probe .top button {
      padding: 0 5px; font-size: 11px; cursor: pointer; background: #2a2a2a; color: #ccc;
      border: 1px solid #444; border-radius: 3px;
    }
    #probe .row { display: flex; gap: 6px; align-items: baseline; }
    #probe .row .k { color: #bbb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    #probe .row .k::after { content: ":"; }
    #probe .row .v { color: #fff; margin-left: auto; text-align: right; white-space: nowrap; }
    #probe .row.off .k, #probe .row.off .v { color: #777; }
    #probe .sw {
      display: inline-block; width: 10px; height: 10px; margin-right: 4px; border: 1px solid #888;
      vertical-align: -1px;
    }
    #probe .lvl { color: #777; font-size: 10.5px; margin-left: 4px; }
    #marker {
      position: absolute; z-index: 6; width: 10px; height: 10px; margin: -6px 0 0 -6px;
      border: 2px solid #ffd54f; border-radius: 50%; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="panel">
    <h1>Mars · Gale crater</h1>
    <div id="picker">
      <div id="pickRow">
        <select id="layerCat" title="Category"><option value="">All types</option></select>
        <input id="layerSearch" type="search" placeholder="Add layer: albedo, DEM, THEMIS…" autocomplete="off" spellcheck="false" />
      </div>
      <div id="pickOpts">
        <label><input id="globalOnly" type="checkbox" checked /> Global only</label>
        <span id="pickCount"></span>
      </div>
      <div id="results" hidden></div>
    </div>
    <div id="layers"></div>
    <div class="hint" style="margin:0 0 8px">Click the map to read every layer's pixel at that spot.</div>
    <div id="spotControls"><div class="sub">Mission spots</div><button id="spotToggle" type="button" aria-pressed="true">Markers on</button></div>
    <div id="spotFilters">
      <input id="spotSearch" type="search" placeholder="Search spots, missions, tags…" aria-label="Search mission spots" />
      <select id="spotCategory" aria-label="Filter spots by category"><option value="">All categories</option></select>
      <div id="spotTagFilters" aria-label="Filter spots by tags"></div>
      <div id="spotFilterCount" aria-live="polite"></div>
    </div>
    <div id="spots"></div>
    <div class="sub">View</div>
    <div id="view">
      <button id="btnTop" class="on">Top-down</button>
      <button id="btnTilt">Tilted 60°</button>
      <div id="tiltRow">
        <span>Tilt</span><input id="tilt" type="range" min="0" max="60" step="1" value="0" />
        <span id="tiltVal">0°</span>
      </div>
      <div id="reliefRow" class="tiltRow">
        <label><input id="relief" type="checkbox" checked /> 3D relief</label>
        <input id="exag" type="range" min="1" max="10" step="0.5" value="2" title="Height exaggeration" />
        <span id="exagVal">×2</span>
      </div>
      <div id="terrainNote" class="note"></div>
    </div>
    <div id="readout"></div>
    <div id="ground"></div>
    <div id="status"></div>
    <div class="sub">Tile cache</div>
    <div id="cache"><span id="cacheInfo">…</span> <button id="btnClear">Clear</button></div>
    <div class="hint">Left-drag: move · wheel / right-drag: zoom · hold left + right buttons and drag up/down: tilt (max 60°) · touch: two-finger drag up/down to tilt</div>
  </div>
  <div id="marker" hidden></div>
  <div id="probe" hidden></div>
  <section id="spotCard" hidden aria-live="polite">
    <div class="spotHead"><h2 id="spotTitle"></h2><button id="spotClose" type="button" aria-label="Close spot details">×</button></div>
    <div class="spotType" id="spotType"></div>
    <div id="spotTags"></div>
    <img id="spotImage" hidden alt="" />
    <div id="spotImageCaption" hidden></div>
    <div id="spotStats"></div><div class="spotNote" id="spotNote"></div>
    <button id="spotVrButton" type="button" hidden>Open street view</button>
  </section>
  <div id="scale">
    <div id="scaleLabel">–</div>
    <div id="scaleBar" style="width:100px"></div>
    <div class="dist" id="scaleDist"></div>
  </div>

  <!-- CESIUM_BASE_URL must be set before Cesium.js loads: it tells Cesium where its workers live. -->
  <script>window.CESIUM_BASE_URL = "./node_modules/cesium/Build/Cesium/";</script>
  <script src="./node_modules/cesium/Build/Cesium/Cesium.js"></script>
  <script>
  (async function () {
    const statusEl = document.getElementById("status");
    // Double-clicking index.html opens it as file://, where Chrome blocks Cesium's web workers
    // and data files. Nothing can render that way, so say so instead of showing a broken globe.
    if (location.protocol === "file:") {
      statusEl.style.color = "#ff8a80";
      statusEl.style.fontSize = "13px";
      statusEl.innerHTML =
        "<b>This page can't run as a file.</b><br>Close this tab and double-click " +
        "<code>start-viewer.bat</code> on Windows or run <code>./start-viewer.sh</code> on Linux " +
        "from the project folder. It serves <code>http://localhost:8080</code>.";
      return;
    }
    if (typeof Cesium === "undefined") {
      statusEl.textContent =
        "Cesium did not load. In the web folder run:  npm install cesium  and reload.";
      return;
    }

    // ---------------------------------------------------------------- tile source
    // NASA Trek is CORS-open but slow (2-10 s per tile). When the page is served by serve.mjs
    // (start-viewer.bat) we go through its /trek proxy, which caches tiles on disk.
    // ?direct forces direct Trek requests; any other static server falls back to direct too.
    // Browser-side tile cache (tile-sw.js): survives browser restarts and works in ?direct mode.
    // Wait (briefly) until it controls the page, otherwise the first tiles would bypass it.
    const SW_OK = "serviceWorker" in navigator && window.isSecureContext;
    if (SW_OK) {
      try {
        await navigator.serviceWorker.register("./tile-sw.js");
        if (!navigator.serviceWorker.controller) {
          await Promise.race([
            new Promise((r) => navigator.serviceWorker.addEventListener("controllerchange", r, { once: true })),
            new Promise((r) => setTimeout(r, 2000)),
          ]);
        }
      } catch (err) {
        console.warn("Tile cache service worker not available:", err);
      }
    }

    const USE_PROXY = !new URLSearchParams(location.search).has("direct") &&
      (await fetch("./__proxy", { cache: "no-store" }).then((r) => r.ok).catch(() => false));
    const TILE_BASE = USE_PROXY ? "/trek" : "https://trek.nasa.gov/tiles";

    // ---------------------------------------------------------------- Mars, not Earth
    const MARS = Cesium.Ellipsoid.MARS;       // IAU 2000: 3396190 / 3396190 / 3376200 m
    Cesium.Ellipsoid.default = MARS;          // before anything else is created

    // Trek's tile grid: 256 px tiles, 2 x 1 tiles at level 0, row 0 at the north.
    const marsTiling = () =>
      new Cesium.GeographicTilingScheme({
        ellipsoid: MARS,
        numberOfLevelZeroTilesX: 2,
        numberOfLevelZeroTilesY: 1,
      });

    // ---------------------------------------------------------------- layers
    // maxLevel values were checked against Trek on 2026-11-14 (the next level returns 404).
    // Gale only has tiles inside its bounding box, so the layer is limited to it.
    const LAYERS = [
      {
        name: "Viking colour mosaic",
        dataset: "Mars_Viking_MDIM21_ClrMosaic_global_232m", ext: "jpg", maxLevel: 7,
        bounds: null, show: true, alpha: 1,
        note: "Global · 232 m/px · Viking Orbiter",
        credit: "Viking MDIM 2.1 colorized mosaic: NASA/JPL/USGS, via NASA Trek",
      },
      {
        name: "MOLA + HRSC colour relief",
        dataset: "Mars_MOLA_blend200ppx_HRSC_ClrShade_clon0dd_200mpp_lzw", ext: "jpg", maxLevel: 8,
        bounds: null, show: false, alpha: 0.7,
        note: "Global · 200 m/px · Mars Global Surveyor MOLA + Mars Express HRSC",
        credit: "MOLA/HRSC blended elevation: NASA, DLR, USGS, via NASA Trek",
      },
      {
        name: "MOLA colour relief",
        dataset: "Mars_MGS_MOLA_ClrShade_merge_global_463m", ext: "jpg", maxLevel: 7,
        bounds: null, show: false, alpha: 0.7,
        note: "Global · 463 m/px · Mars Global Surveyor MOLA",
        credit: "MOLA colorized shaded relief: NASA/GSFC, via NASA Trek",
      },
      {
        name: "Gale HiRISE mosaic",
        dataset: "curiosity_hirise_mosaic", ext: "png", maxLevel: 16,
        bounds: [137.1224669, -4.9254743, 137.7298129, -4.2489588], show: true, alpha: 1,
        // Below level 8 a single tile covers far more than Gale, and Cesium would stretch it
        // into a grey smear over the Viking colours. Start at 8 (~4 tiles over the box).
        minLevel: 8,
        note: "Gale only (about 36 × 40 km) · ~0.6 m/px at the deepest tile level · Mars Reconnaissance Orbiter HiRISE",
        credit: "HiRISE mosaic of Gale: NASA/JPL/University of Arizona/USGS, via NASA Trek",
      },
    ];

    function makeProvider(l) {
      const rect = l.bounds
        ? Cesium.Rectangle.fromDegrees(...l.bounds)
        : Cesium.Rectangle.fromDegrees(-180, -90, 180, 90);
      return new Cesium.UrlTemplateImageryProvider({
        url: `${TILE_BASE}/Mars/EQ/${l.dataset}/1.0.0/default/default028mm/{z}/{y}/{x}.${l.ext}`,
        tilingScheme: marsTiling(),
        rectangle: rect,
        minimumLevel: l.minLevel ?? 0,
        maximumLevel: l.maxLevel,
        tileWidth: 256,
        tileHeight: 256,
        credit: l.credit,
      });
    }

    // ---------------------------------------------------------------- viewer
    const viewer = new Cesium.Viewer("cesiumContainer", {
      globe: new Cesium.Globe(MARS),
      mapProjection: new Cesium.GeographicProjection(MARS),
      baseLayer: false,         // no Earth imagery
      baseLayerPicker: false,
      geocoder: false,          // Earth place names
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      fullscreenButton: false,
      timeline: false,
      animation: false,
      infoBox: false,
      selectionIndicator: false,
      skyAtmosphere: false,     // the blue haze is Earth's
    });
    // Cesium only creates the Moon/Sun for an Earth globe, so these can be undefined here.
    if (viewer.scene.moon) viewer.scene.moon.show = false;
    if (viewer.scene.sun) viewer.scene.sun.show = false;   // sun position is Earth's, not Mars's
    const globe = viewer.scene.globe;
    globe.showGroundAtmosphere = false;
    globe.enableLighting = false;
    globe.baseColor = Cesium.Color.fromCssColorString("#5b3a29");
    viewer.scene.screenSpaceCameraController.minimumZoomDistance = 50;
    // Keep more decoded tiles in memory (default 100) so panning back and forth doesn't refetch.
    globe.tileCacheSize = 1000;

    // ---------------------------------------------------------------- terrain (3D relief)
    // Heights come from serve.mjs (/terrain/z/x/y): MOLA elevation, ~1.85 km/px, metres above
    // the Mars areoid ("sea level"). Same 2 x 1 geographic tiling as the imagery, so they line up.
    // Without serve.mjs, or while it is still downloading MOLA, the globe stays flat.
    const flatTerrain = new Cesium.EllipsoidTerrainProvider({ ellipsoid: MARS, tilingScheme: marsTiling() });
    const TILE_N = 65;
    // Level of detail: the server only has a coarse global grid up front and fetches finer MOLA
    // data on demand. Until a tile is ready we return undefined ("try again later"); Cesium
    // keeps drawing the coarser parent tile, upsampled, and re-asks only while the tile is
    // still on screen. No request is held open, so terrain never blocks imagery downloads.
    const terrainTiles = new Map(); // "z/x/y" -> { data } | { loading } | { retryAt }
    function terrainTile(x, y, level) {
      const key = `${level}/${x}/${y}`;
      const s = terrainTiles.get(key);
      const now = performance.now();
      if (s?.data) { terrainTiles.delete(key); return Promise.resolve(s.data); }
      if (s && (s.loading || now < s.retryAt)) return undefined;
      if (terrainTiles.size > 3000) { // forget tiles Cesium stopped asking for
        for (const [k, v] of terrainTiles) if (!v.loading && now - (v.at ?? 0) > 30_000) terrainTiles.delete(k);
      }
      terrainTiles.set(key, { loading: true });
      const retry = (ms) => terrainTiles.set(key, { retryAt: performance.now() + ms, at: performance.now() });
      fetch(`/terrain/${key}?v=2`)
        .then(async (r) => {
          if (r.status === 200) terrainTiles.set(key, { data: new Float32Array(await r.arrayBuffer()), at: performance.now() });
          else retry(r.status === 202 ? 1000 : 5000); // 202 = server is fetching this area
        })
        .catch(() => retry(5000));
      return undefined;
    }
    const molaTerrain = new Cesium.CustomHeightmapTerrainProvider({
      ellipsoid: MARS,
      tilingScheme: marsTiling(),
      width: TILE_N,
      height: TILE_N,
      credit: "MOLA elevation: NASA/GSFC MGS MOLA team, via NASA PDS",
      callback: terrainTile,
    });
    const reliefBox = document.getElementById("relief");
    const exagSlider = document.getElementById("exag");
    const exagVal = document.getElementById("exagVal");
    const terrainNote = document.getElementById("terrainNote");
    let terrainReady = false;

    function applyRelief() {
      const on = terrainReady && reliefBox.checked;
      const want = on ? molaTerrain : flatTerrain;
      if (globe.terrainProvider !== want) globe.terrainProvider = want;
      viewer.scene.verticalExaggeration = on ? Number(exagSlider.value) : 1;
      exagVal.textContent = `×${exagSlider.value}`;
      exagSlider.disabled = !on;
    }
    reliefBox.addEventListener("change", applyRelief);
    exagSlider.addEventListener("input", applyRelief);

    async function waitForTerrain() {
      if (!USE_PROXY) {
        terrainNote.textContent = "Relief needs start-viewer.bat (local server).";
        reliefBox.disabled = true;
        return;
      }
      for (;;) {
        const s = await fetch("./terrain/status", { cache: "no-store" }).then((r) => r.json()).catch(() => null);
        if (s?.ready) break;
        if (s?.error) { terrainNote.textContent = `Relief unavailable: ${s.error}`; reliefBox.disabled = true; return; }
        terrainNote.textContent = `Loading global elevation… ${Math.round((s?.progress ?? 0) * 100)}%`;
        await new Promise((r) => setTimeout(r, 1000));
      }
      terrainReady = true;
      terrainNote.textContent = "MOLA elevation · detail sharpens as you zoom in (down to ~1.85 km/px)";
      applyRelief();
    }
    applyRelief();
    waitForTerrain();

    // ---------------------------------------------------------------- layer manager
    // `active` is the draw order, bottom first. The panel lists it top first, like a layer stack.
    // A layer definition: { dataset, name, ext, maxLevel, minLevel?, bounds, note, credit,
    // show, alpha }. Layers picked from the Trek catalog get theirs from the layer's
    // WMTSCapabilities.xml. The stack is remembered in this browser.
    const STORE_KEY = "mars-layers-v1";
    const active = []; // { def, layer, errors }
    const layersEl = document.getElementById("layers");
    let failed = 0;

    function addLayer(def, { save = true } = {}) {
      const provider = makeProvider(def);
      const entry = { def, layer: null, errors: 0 };
      provider.errorEvent.addEventListener((err) => {
        // Regional and sparse layers have holes: a 404 is "no tile here", not a failure.
        if (err?.error?.statusCode === 404) return;
        entry.errors += 1;
        failed += 1;
        console.warn(`Tile failed [${def.dataset}]:`, err && err.message);
        statusEl.textContent =
          `${failed} tile request(s) failed. Open the Console (F12). ` +
          (USE_PROXY ? "NASA Trek may be slow or down; reload to retry."
                     : "Start the page with start-viewer.bat so tiles go through the caching proxy.");
      });
      entry.layer = viewer.imageryLayers.addImageryProvider(provider);
      entry.layer.show = def.show;
      entry.layer.alpha = def.alpha;
      active.push(entry);
      renderLayers();
      if (save) saveLayers();
      return entry;
    }

    function removeLayer(entry) {
      viewer.imageryLayers.remove(entry.layer, true);
      active.splice(active.indexOf(entry), 1);
      renderLayers();
      saveLayers();
      renderResults();
    }

    // dir +1 = towards the top of the stack (drawn over the others)
    function moveLayer(entry, dir) {
      const i = active.indexOf(entry), j = i + dir;
      if (j < 0 || j >= active.length) return;
      if (dir > 0) viewer.imageryLayers.raise(entry.layer); else viewer.imageryLayers.lower(entry.layer);
      [active[i], active[j]] = [active[j], active[i]];
      renderLayers();
      saveLayers();
    }

    function saveLayers() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(active.map((e) => ({
          ...e.def, show: e.layer.show, alpha: e.layer.alpha,
        }))));
      } catch {}
    }

    function button(text, title, onClick) {
      const b = document.createElement("button");
      b.textContent = text;
      b.title = title;
      b.addEventListener("click", onClick);
      return b;
    }

    function renderLayers() {
      layersEl.replaceChildren();
      for (let k = active.length - 1; k >= 0; k--) {
        const entry = active[k], { def, layer } = entry;
        const row = document.createElement("div");
        row.className = "layer";
        const head = document.createElement("div");
        head.className = "head";
        const label = document.createElement("label");
        label.title = def.name;
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = layer.show;
        box.addEventListener("change", () => { layer.show = box.checked; saveLayers(); });
        const name = document.createElement("span");
        name.textContent = def.name;
        label.append(box, name);
        const up = button("▲", "Draw above the layer over it", () => moveLayer(entry, +1));
        const down = button("▼", "Draw below the layer under it", () => moveLayer(entry, -1));
        up.disabled = k === active.length - 1;
        down.disabled = k === 0;
        head.append(label, up, down, button("✕", "Remove layer", () => removeLayer(entry)));
        const slider = document.createElement("input");
        slider.type = "range"; slider.min = "0"; slider.max = "1"; slider.step = "0.05";
        slider.value = String(layer.alpha);
        slider.title = "Opacity";
        slider.addEventListener("input", () => { layer.alpha = Number(slider.value); });
        slider.addEventListener("change", saveLayers);
        const note = document.createElement("div");
        note.className = "note";
        note.textContent = def.note;
        row.append(head, slider, note);
        layersEl.append(row);
      }
    }

    // First visit (or unreadable storage): the built-in stack. Otherwise what was there last time.
    let stored = null;
    try { stored = JSON.parse(localStorage.getItem(STORE_KEY)); } catch {}
    const startDefs = Array.isArray(stored) && stored.every((d) => d && d.dataset && d.ext)
      ? stored : LAYERS;
    for (const d of startDefs) addLayer({ ...d }, { save: false });

    // ---------------------------------------------------------------- Trek layer catalog
    // serve.mjs /catalog lists every Trek Mars product (minus vector-only ones). Picking one
    // reads its WMTSCapabilities.xml for tile format, extent and deepest level, then adds it.
    const catSel = document.getElementById("layerCat");
    const searchEl = document.getElementById("layerSearch");
    const globalOnly = document.getElementById("globalOnly");
    const resultsEl = document.getElementById("results");
    const pickCount = document.getElementById("pickCount");
    let catalog = null;          // array, or null while loading / unavailable
    let catalogMsg = "Loading the Trek layer list…";
    let shown = [];              // items currently in the results list
    let hl = -1;                 // keyboard-highlighted index into `shown`

    async function loadCatalog() {
      if (!USE_PROXY) {
        catalogMsg = "Layer search needs start-viewer.bat (local server).";
        return renderResults();
      }
      try {
        const r = await fetch("./catalog");
        if (!r.ok) throw new Error(await r.text());
        catalog = await r.json();
        const cats = [...new Set(catalog.map((c) => c.cat))].sort();
        for (const c of cats) catSel.add(new Option(c, c));
      } catch (err) {
        catalogMsg = `Could not load the layer list: ${err.message}`;
      }
      renderResults();
    }

    const isActive = (id) => active.some((e) => e.def.dataset === id);

    function matches(item, words) {
      const hay = `${item.title} ${item.id} ${item.cat} ${item.sub} ${item.mission} ${item.instrument}`.toLowerCase();
      return words.every((w) => hay.includes(w));
    }

    function renderResults() {
      resultsEl.replaceChildren();
      shown = [];
      if (!catalog) {
        pickCount.textContent = "";
        const p = document.createElement("div");
        p.className = "empty";
        p.textContent = catalogMsg;
        resultsEl.append(p);
        return;
      }
      const words = searchEl.value.toLowerCase().split(/\s+/).filter(Boolean);
      shown = catalog
        .filter((c) => (!globalOnly.checked || c.global) && (!catSel.value || c.cat === catSel.value) && matches(c, words))
        .sort((a, b) => a.cat.localeCompare(b.cat) || b.global - a.global || a.title.localeCompare(b.title));
      pickCount.textContent = `${shown.length} layer${shown.length === 1 ? "" : "s"}`;
      if (hl >= shown.length) hl = shown.length - 1;
      if (!shown.length) {
        const p = document.createElement("div");
        p.className = "empty";
        p.textContent = globalOnly.checked ? "No global layer matches. Untick “Global only” to search regional ones too." : "Nothing matches.";
        resultsEl.append(p);
        return;
      }
      let group = null;
      shown.forEach((item, i) => {
        if (item.cat !== group) {
          group = item.cat;
          const g = document.createElement("div");
          g.className = "grp";
          g.textContent = group;
          resultsEl.append(g);
        }
        const el = document.createElement("div");
        el.className = "item" + (i === hl ? " hl" : "") + (isActive(item.id) ? " added" : "");
        el.title = item.desc || item.title;
        const t = document.createElement("div");
        t.className = "t";
        t.textContent = item.title;
        const badge = document.createElement("span");
        badge.className = item.global ? "badge" : "badge reg";
        badge.textContent = item.global ? "global" : "regional";
        t.append(badge);
        const m = document.createElement("div");
        m.className = "m";
        m.textContent = isActive(item.id) ? "already on the map"
          : [item.sub, item.mission, item.instrument].filter(Boolean).join(" · ") || item.id;
        el.append(t, m);
        el.addEventListener("mousedown", (e) => { e.preventDefault(); pick(item, el); });
        resultsEl.append(el);
        item._el = el;
      });
    }

    function setHighlight(i) {
      shown[hl]?._el?.classList.remove("hl");
      hl = Math.max(0, Math.min(shown.length - 1, i));
      const el = shown[hl]?._el;
      if (el) { el.classList.add("hl"); el.scrollIntoView({ block: "nearest" }); }
    }

    // Tile format, extent and number of zoom levels from the layer's WMTS capabilities.
    async function layerDefFromCatalog(item) {
      const url = `${TILE_BASE}/Mars/EQ/${item.id}/1.0.0/WMTSCapabilities.xml`;
      const r = await fetch(url);
      const text = await r.text();
      if (!r.ok || !text.includes("<Capabilities")) throw new Error("Trek has no tiles for this layer");
      const xml = new DOMParser().parseFromString(text, "application/xml");
      const all = (name) => [...xml.getElementsByTagNameNS("*", name)];
      const format = all("Format")[0]?.textContent.trim() ?? "image/png";
      // only the real matrix definitions have a ScaleDenominator (TileMatrixSetLimits also say TileMatrix)
      const levels = all("TileMatrix").filter((m) => m.getElementsByTagNameNS("*", "ScaleDenominator").length);
      if (!levels.length) throw new Error("no zoom levels in the capabilities");
      const box = all("WGS84BoundingBox")[0] ?? all("BoundingBox")[0];
      const corner = (n) => box?.getElementsByTagNameNS("*", n)[0]?.textContent.trim().split(/\s+/).map(Number);
      const lo = corner("LowerCorner"), hi = corner("UpperCorner");
      let bounds = lo && hi && [lo[0], lo[1], hi[0], hi[1]].every(Number.isFinite) ? [lo[0], lo[1], hi[0], hi[1]] : item.bbox;
      const global = bounds[0] >= -180.5 && bounds[2] <= 180.5 && bounds[2] - bounds[0] >= 350 && bounds[1] <= -60 && bounds[3] >= 60;
      // Start a regional layer at the level where one tile is about the size of its area,
      // otherwise Cesium stretches a near-empty top-level tile across a huge region.
      const span = Math.max(bounds[2] - bounds[0], bounds[3] - bounds[1], 1e-6);
      const minLevel = global ? 0 : Math.max(0, Math.min(levels.length - 1, Math.floor(Math.log2(180 / span))));
      if (global && bounds[3] - bounds[1] >= 170) bounds = null; // truly whole-planet: no clip needed
      const maxLevel = levels.length - 1;
      const mpp = ((Math.PI * MARS.maximumRadius) / (256 * 2 ** maxLevel));
      return {
        dataset: item.id,
        name: item.title,
        ext: /png/.test(format) ? "png" : "jpg",
        maxLevel,
        minLevel,
        bounds,
        show: true,
        alpha: 1,
        note: `${global ? "Global" : "Regional"} · ~${mpp >= 1000 ? `${(mpp / 1000).toFixed(1)} km` : `${Math.round(mpp)} m`}/px at deepest level` +
          ([item.mission, item.instrument].filter(Boolean).length ? ` · ${[item.mission, item.instrument].filter(Boolean).join(" ")}` : ""),
        credit: `${item.title}: via NASA Trek`,
      };
    }

    async function pick(item, el) {
      if (isActive(item.id) || item._busy) return;
      item._busy = true;
      const m = el?.querySelector(".m");
      if (m) m.textContent = "reading layer info…";
      try {
        const def = await layerDefFromCatalog(item);
        addLayer(def);
        if (def.bounds) { // regional: show where it is
          const [w, s, e, n] = def.bounds;
          viewer.camera.flyTo({ destination: Cesium.Rectangle.fromDegrees(w, s, e, n), duration: 2 });
        }
        renderResults();
      } catch (err) {
        if (m) { m.textContent = `can't add: ${err.message}`; m.style.color = "#ff8a80"; }
      } finally {
        item._busy = false;
      }
    }

    const openResults = () => { resultsEl.hidden = false; renderResults(); };
    searchEl.addEventListener("focus", openResults);
    searchEl.addEventListener("input", () => { hl = -1; openResults(); });
    catSel.addEventListener("change", () => { hl = -1; openResults(); searchEl.focus(); });
    globalOnly.addEventListener("change", () => { hl = -1; openResults(); searchEl.focus(); });
    searchEl.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); resultsEl.hidden = false; setHighlight(hl + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); setHighlight(hl - 1); }
      else if (e.key === "Enter" && shown[hl]) { e.preventDefault(); pick(shown[hl], shown[hl]._el); }
      else if (e.key === "Escape") { resultsEl.hidden = true; searchEl.blur(); }
    });
    // close when clicking anywhere outside the picker
    document.addEventListener("mousedown", (e) => {
      if (!document.getElementById("picker").contains(e.target)) resultsEl.hidden = true;
    });
    loadCatalog();

    // ---------------------------------------------------------------- camera
    const GALE = { lon: 137.44, lat: -4.59 };   // Bradbury Landing area, inside the HiRISE mosaic
    const HOME = Cesium.Cartesian3.fromDegrees(-60, 10, 14_000_000, MARS);
    viewer.camera.setView({ destination: HOME });

    // Tilt = angle away from looking straight down (0° = top-down, MAX_TILT = most oblique allowed).
    // Note: there is no 3D terrain yet, so a tilted view shows the flat imagery in perspective.
    const MAX_TILT = 60;
    let tiltDeg = 0;
    const currentTilt = () => 90 + Cesium.Math.toDegrees(viewer.camera.pitch);
    const pitchFor = (deg) => Cesium.Math.toRadians(-90 + deg);

    // Look at (lon, lat) on the surface from `range` metres away at the current tilt.
    function fly(lon, lat, range, seconds) {
      const target = Cesium.Cartesian3.fromDegrees(lon, lat, 0, MARS);
      viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(target, 0), {
        offset: new Cesium.HeadingPitchRange(0, pitchFor(tiltDeg), range),
        duration: seconds ?? 3,
      });
    }

    // Spot selection is a destination flight: center the pin under a top-down camera.
    // flyToBoundingSphere leaves the camera in a target-relative orbit frame, which makes
    // subsequent navigation feel like orbiting a POI instead of exploring the planet.
    function flyToSpot(lon, lat, range) {
      tiltDeg = 0;
      showTilt(0);
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(lon, lat, range, MARS),
        orientation: { heading: viewer.camera.heading, pitch: -Cesium.Math.PI_OVER_TWO, roll: 0 },
        duration: 2.5,
      });
    }

    // Surface point at a screen position, or undefined if that pixel shows sky.
    // With relief on, this hits the actual terrain; otherwise (or off the loaded tiles) the ellipsoid.
    function surfaceAt(x, y) {
      const pos = new Cesium.Cartesian2(x, y);
      return globe.pick(viewer.camera.getPickRay(pos), viewer.scene) ??
        viewer.camera.pickEllipsoid(pos, MARS);
    }
    function viewCentre() {
      const c = viewer.scene.canvas;
      return surfaceAt(c.clientWidth / 2, c.clientHeight / 2) ??
        MARS.scaleToGeodeticSurface(viewer.camera.positionWC);   // fallback: point under camera
    }

    const tiltSlider = document.getElementById("tilt");
    const tiltVal = document.getElementById("tiltVal");
    const btnTop = document.getElementById("btnTop");
    const btnTilt = document.getElementById("btnTilt");
    function showTilt(deg) {
      tiltSlider.value = String(deg);
      tiltVal.textContent = `${deg}°`;
      btnTop.classList.toggle("on", deg === 0);
      btnTilt.classList.toggle("on", deg === 60);
    }
    // Re-aim the camera around the point in the middle of the screen, keeping the distance.
    function setTilt(deg, seconds) {
      tiltDeg = deg;
      showTilt(deg);
      const target = viewCentre();
      const range = Cesium.Cartesian3.distance(viewer.camera.positionWC, target);
      viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(target, 0), {
        offset: new Cesium.HeadingPitchRange(viewer.camera.heading, pitchFor(deg), range),
        duration: seconds ?? 1,
      });
    }
    btnTop.addEventListener("click", () => setTilt(0));
    btnTilt.addEventListener("click", () => setTilt(60));
    tiltSlider.addEventListener("input", () => { tiltVal.textContent = `${tiltSlider.value}°`; });
    tiltSlider.addEventListener("change", () => setTilt(Number(tiltSlider.value), 0.6));

    // Curated, static mission/science spots. Coordinates and mission facts are NASA/JPL
    // references; the spot card labels the map-derived values separately from those facts.
    const BOXWORK_PANORAMAS = [
      { sol: 4512, date: "16 Apr 2025", lon: 137.3882287, lat: -4.79504357, site: 115, drive: 960, heading: 202, dir: "04", file: "N_R000_4512_EDR115CYLASB0960_AUTOLM1", ext: "PNG" },
      { sol: 4525, date: "29 Apr 2025", lon: 137.3877473, lat: -4.79641047, site: 115, drive: 1770, heading: 200, dir: "05", file: "N_R000_4525XEDR115CYLASB1770_AUTOLM1", ext: "PNG" },
      { sol: 4548, date: "23 May 2025", lon: 137.3840451, lat: -4.79879294, site: 116, drive: 1260, heading: 221, dir: "06", file: "N_R000_4548_EDR116CYLASB1260_AUTOLM2", ext: "PNG" },
      { sol: 4561, date: "6 Jun 2025", lon: 137.3835414, lat: -4.79984723, site: 116, drive: 1944, heading: 179, dir: "06", file: "N_R000_4561XEDR116CYLASB1944_AUTOLM1", ext: "PNG" },
      { sol: 4580, date: "25 Jun 2025", lon: 137.3812512, lat: -4.80232637, site: 117, drive: 420, heading: 233, dir: "06", file: "N_R000_4580_EDR117CYLASB0420_AUTOLM1", ext: "PNG" },
      { sol: 4611, date: "27 Jul 2025", lon: 137.3793204, lat: -4.80474015, site: 117, drive: 2730, heading: 239, dir: "07", file: "N_R000_4611XEDR117CYLASB2730_AUTOLM1", ext: "PNG" },
      { sol: 4647, date: "2 Sep 2025", lon: 137.3798121, lat: -4.80689063, site: 118, drive: 2268, heading: 98, dir: "09", file: "N_R000_4647_EDR118CYLASB2268_AUTOLM1", ext: "PNG" },
      { sol: 4671, date: "27 Sep 2025", lon: 137.3812695, lat: -4.80827103, site: 119, drive: 486, heading: 119, dir: "09", file: "N_R000_4671_EDR119CYLASB0486_AUTOLM1", ext: "jpg" },
    ];
    // A regular MAHLI close-up from the same boxwork traverse (Sol 4636), used as
    // representative marker-card imagery instead of repeating the 360° Navcam projections.
    const boxworkPhoto = "https://assets.science.nasa.gov/dynamicimage/assets/science/psd/photojournal/pia/pia26/pia26697/PIA26697.jpg?fit=crop&h=540&w=960";
    const panoramaUrl = (p) => `https://science.nasa.gov/resource/sol-${p.sol}-right-navigation-camera-cylindrical-projection/`;
    const SPOTS = [
      { id: "gale-boxwork", name: "Gale · boxwork target", lon: 137.3931242, lat: -4.78692417,
        type: "Science target · Glen Torridon", mission: "Curiosity / Mars Science Laboratory", date: "Boxwork campaign · 2025",
        category: "Science target", tags: ["Gale", "Geology", "Boxwork", "Curiosity"], vrEnabled: true,
        image: boxworkPhoto, imageSource: "https://science.nasa.gov/photojournal/curiosity-studies-nodules-on-boxwork-formations/",
        imageAlt: "Close-up mosaic of mineral nodules in Gale crater boxwork", imageCredit: "NASA/JPL-Caltech/MSSS · Sol 4636",
        note: "Boxwork ridges and hollows can preserve clues to groundwater history. Marker is an approximate regional target, not a rover position.",
        source: "NASA/JPL · Curiosity’s First 360° View of Boxwork Patterns", url: "https://science.nasa.gov/photojournal/curiositys-first-360-degree-view-of-boxwork-patterns/" },
      ...BOXWORK_PANORAMAS.map((p) => ({
        id: `curiosity-sol-${p.sol}`, name: `Boxwork panorama · Sol ${p.sol}`, lon: p.lon, lat: p.lat,
        type: `Curiosity Navcam · site ${p.site}, drive ${p.drive}`, mission: "Mars Science Laboratory",
        date: `Sol ${p.sol} · ${p.date}`, category: "Panorama", tags: ["Gale", "Boxwork", "Curiosity", "Navcam", "360°", `Site ${p.site}`],
        vrEnabled: true, sol: p.sol, site: p.site, drive: p.drive, projection: "360° cylindrical", heading: p.heading,
        positionNote: `NASA waypoint at site ${p.site}, drive ${p.drive}`,
        image: boxworkPhoto, imageSource: "https://science.nasa.gov/photojournal/curiosity-studies-nodules-on-boxwork-formations/",
        imageAlt: "Close-up mosaic of mineral nodules in Gale crater boxwork",
        imageCredit: "NASA/JPL-Caltech/MSSS · Sol 4636 boxwork close-up", source: `NASA · Sol ${p.sol} Right Navcam Panorama`, url: panoramaUrl(p),
      })),
      { id: "curiosity", name: "Curiosity landing", lon: 137.4417, lat: -4.5895,
        type: "Rover landing site", mission: "Curiosity / Mars Science Laboratory", date: "Touchdown · 6 Aug 2012",
        category: "Landing site", tags: ["Gale", "Rover", "MSL", "NASA"], vrEnabled: false,
        note: "Gale crater landing area; mission rover traverse is not plotted in this prototype.", source: "NASA/JPL · Curiosity landing site", url: "https://mars.nasa.gov/msl/mission/timeline/surfaceops/" },
      { id: "viking1", name: "Viking 1", lon: -49.97, lat: 22.48,
        type: "Lander site · Chryse Planitia", mission: "Viking 1", date: "Touchdown · 20 Jul 1976",
        category: "Landing site", tags: ["Chryse Planitia", "Lander", "NASA", "1970s"], vrEnabled: false,
        note: "First successful U.S. landing on Mars.", source: "NASA Science · Viking 1", url: "https://science.nasa.gov/mission/viking-1/" },
      { id: "viking2", name: "Viking 2", lon: -134.29, lat: 47.97,
        type: "Lander site · Utopia Planitia", mission: "Viking 2", date: "Touchdown · 3 Sep 1976",
        category: "Landing site", tags: ["Utopia Planitia", "Lander", "NASA", "1970s"], vrEnabled: false,
        note: "Coordinates shown in planetographic convention.", source: "NASA Science · Viking 2", url: "https://science.nasa.gov/mission/viking-2/" },
      { id: "pathfinder", name: "Pathfinder", lon: 326.75 - 360, lat: 19.13,
        type: "Lander + Sojourner rover", mission: "Mars Pathfinder", date: "Touchdown · 4 Jul 1997",
        category: "Landing site", tags: ["Ares Vallis", "Rover", "Lander", "NASA"], vrEnabled: false,
        note: "A technology demonstration with the Sojourner rover.", source: "NASA NSSDC · Mars Pathfinder", url: "https://nssdc.gsfc.nasa.gov/planetary/mesur.html" },
      { id: "perseverance", name: "Perseverance", lon: 77.45, lat: 18.44,
        type: "Rover landing site · Jezero crater", mission: "Perseverance / Mars 2020", date: "Touchdown · 18 Feb 2021",
        category: "Landing site", tags: ["Jezero", "Rover", "Mars 2020", "NASA"], vrEnabled: false,
        note: "Jezero crater landing site. Coordinates are an approximate map pin.", source: "NASA Science · How We Land on Mars", url: "https://science.nasa.gov/planetary-science/programs/mars-exploration/mission-timeline/how-we-land-on-mars/" },
    ];
    const spotButtons = new Map();
    const spotEntities = new Map();
    const activeSpotTags = new Set();
    let spotsVisible = true;
    let selectedSpot = null;
    const spotToggle = document.getElementById("spotToggle");
    const spotsEl = document.getElementById("spots");
    for (const spot of SPOTS) {
      const entity = viewer.entities.add({
        id: `spot-${spot.id}`, position: Cesium.Cartesian3.fromDegrees(spot.lon, spot.lat, 0, MARS),
        show: spotsVisible,
        properties: { spotId: spot.id, category: spot.category, tags: spot.tags ?? [], vrEnabled: !!spot.vrEnabled },
        billboard: {
          image: `data:image/svg+xml;charset=utf-8,${encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" width="38" height="46" viewBox="0 0 38 46"><path d="M19 2C9.6 2 3 8.8 3 17.2 3 28 19 44 19 44s16-16 16-26.8C35 8.8 28.4 2 19 2Z" fill="#171614" fill-opacity=".96" stroke="${spot.id === "gale-boxwork" ? "#f4c66a" : "#8fc9dc"}" stroke-width="2.2"/><circle cx="19" cy="17" r="7" fill="${spot.id === "gale-boxwork" ? "#f4c66a" : "#8fc9dc"}" fill-opacity=".2" stroke="${spot.id === "gale-boxwork" ? "#f4c66a" : "#8fc9dc"}" stroke-width="1.6"/><circle cx="19" cy="17" r="2.5" fill="#fff"/></svg>`
          )}`,
          width: 38, height: 46, verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          scaleByDistance: new Cesium.NearFarScalar(2e4, 1, 1e7, 0.8),
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
        },
        label: { text: spot.name, show: false, font: "12px sans-serif", fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.fromCssColorString("#151515"), outlineWidth: 3, style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          pixelOffset: new Cesium.Cartesian2(0, -14), verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          disableDepthTestDistance: 50000, distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 1800000) },
      });
      spotEntities.set(spot.id, entity);
      const b = document.createElement("button");
      b.append(document.createTextNode(spot.name));
      if (spot.vrEnabled) {
        const badge = document.createElement("span"); badge.className = "spotBadge"; badge.textContent = "VR";
        b.append(badge);
      }
      b.addEventListener("click", () => { setSpotsVisible(true); selectSpot(spot); });
      spotsEl.append(b); spotButtons.set(spot.id, b);
    }
    const spotCard = document.getElementById("spotCard");
    const spotStats = document.getElementById("spotStats");
    const spotImage = document.getElementById("spotImage");
    const spotImageCaption = document.getElementById("spotImageCaption");
    const spotVrButton = document.getElementById("spotVrButton");
    function addSpotStat(key, value) {
      const k = document.createElement("span"), v = document.createElement("span");
      k.textContent = key; v.textContent = value; spotStats.append(k, v);
      return v;
    }
    function setSpotsVisible(visible) {
      spotsVisible = visible;
      if (!visible) {
        selectedSpot = null;
        spotCard.hidden = true;
        for (const entity of spotEntities.values()) entity.label.show = false;
        for (const b of spotButtons.values()) b.classList.remove("active");
      }
      applySpotFilters();
      spotToggle.textContent = visible ? "Markers on" : "Markers off";
      spotToggle.classList.toggle("on", visible);
      spotToggle.setAttribute("aria-pressed", String(visible));
    }
    function spotMatches(spot) {
      const query = document.getElementById("spotSearch").value.trim().toLowerCase();
      const category = document.getElementById("spotCategory").value;
      const haystack = [spot.name, spot.type, spot.mission, spot.note, spot.category, ...(spot.tags ?? [])].join(" ").toLowerCase();
      return (!query || haystack.includes(query)) && (!category || spot.category === category) &&
        [...activeSpotTags].every((tag) => spot.tags?.includes(tag));
    }
    function applySpotFilters() {
      let count = 0;
      for (const spot of SPOTS) {
        const matches = spotMatches(spot);
        if (matches) count++;
        spotButtons.get(spot.id).hidden = !matches;
        spotEntities.get(spot.id).show = spotsVisible && matches;
        if (!matches && selectedSpot?.id === spot.id) {
          selectedSpot = null; spotCard.hidden = true;
          spotEntities.get(spot.id).label.show = false;
          spotButtons.get(spot.id).classList.remove("active");
        }
      }
      document.getElementById("spotFilterCount").textContent = `${count} of ${SPOTS.length} spots`;
    }
    const categoryFilter = document.getElementById("spotCategory");
    for (const category of [...new Set(SPOTS.map((spot) => spot.category))].sort()) {
      const option = document.createElement("option"); option.value = category; option.textContent = category;
      categoryFilter.append(option);
    }
    const tagFilters = document.getElementById("spotTagFilters");
    for (const tag of [...new Set(SPOTS.flatMap((spot) => spot.tags ?? []))].sort()) {
      const b = document.createElement("button"); b.type = "button"; b.className = "spotTagFilter"; b.textContent = tag;
      b.addEventListener("click", () => {
        if (activeSpotTags.has(tag)) activeSpotTags.delete(tag); else activeSpotTags.add(tag);
        b.classList.toggle("on", activeSpotTags.has(tag));
        b.setAttribute("aria-pressed", String(activeSpotTags.has(tag)));
        applySpotFilters();
      });
      b.setAttribute("aria-pressed", "false"); tagFilters.append(b);
    }
    document.getElementById("spotSearch").addEventListener("input", applySpotFilters);
    categoryFilter.addEventListener("change", applySpotFilters);
    applySpotFilters();
    spotToggle.addEventListener("click", () => setSpotsVisible(!spotsVisible));
    setSpotsVisible(true);
    spotVrButton.addEventListener("click", () => {
      statusEl.textContent = "Street-view mode is planned for this spot but is not available yet.";
    });
    document.getElementById("spotClose").addEventListener("click", () => {
      spotCard.hidden = true;
      selectedSpot = null;
      for (const b of spotButtons.values()) b.classList.remove("active");
      for (const entity of spotEntities.values()) entity.label.show = false;
    });
    async function selectSpot(spot) {
      closeProbe();
      selectedSpot = spot;
      for (const [id, b] of spotButtons) b.classList.toggle("active", id === spot.id);
      for (const [id, entity] of spotEntities) entity.label.show = id === spot.id;
      document.getElementById("spotTitle").textContent = spot.name;
      document.getElementById("spotType").textContent = `${spot.category} · ${spot.type} · ${spot.mission}`;
      const spotTags = document.getElementById("spotTags");
      spotTags.replaceChildren();
      for (const tag of spot.tags ?? []) {
        const chip = document.createElement("span"); chip.className = "spotTag"; chip.textContent = tag; spotTags.append(chip);
      }
      spotImage.hidden = !spot.image;
      spotImageCaption.hidden = !spot.image;
      spotImage.onerror = () => { spotImage.hidden = true; spotImageCaption.hidden = true; };
      if (spot.image) {
        spotImage.src = spot.image;
        spotImage.alt = spot.imageAlt ?? `${spot.name} image`;
        spotImageCaption.replaceChildren(document.createTextNode("Image: "));
        if (spot.imageSource) {
          const imageSource = document.createElement("a");
          imageSource.textContent = spot.imageCredit ?? "NASA image";
          imageSource.href = spot.imageSource; imageSource.target = "_blank"; imageSource.rel = "noopener noreferrer";
          imageSource.style.color = "#9fd3ff"; spotImageCaption.append(imageSource);
        } else spotImageCaption.append(document.createTextNode(spot.imageCredit ?? ""));
      } else {
        spotImage.removeAttribute("src"); spotImage.alt = ""; spotImageCaption.textContent = "";
      }
      spotVrButton.hidden = !spot.vrEnabled;
      const note = document.getElementById("spotNote");
      note.replaceChildren(document.createTextNode(`${spot.date}. ${spot.note} Source: `));
      const source = document.createElement("a");
      source.textContent = spot.source; source.href = spot.url; source.target = "_blank"; source.rel = "noopener noreferrer";
      source.style.color = "#9fd3ff"; note.append(source, document.createTextNode("."));
      spotStats.replaceChildren();
      const ns = spot.lat >= 0 ? "N" : "S", ew = spot.lon >= 0 ? "E" : "W";
      addSpotStat("Latitude", `${Math.abs(spot.lat).toFixed(4)}° ${ns}`);
      addSpotStat("Longitude", `${Math.abs(spot.lon).toFixed(4)}° ${ew}`);
      if (spot.sol) {
        addSpotStat("Sol · site", `${spot.sol} · ${spot.site}`);
        addSpotStat("Drive · heading", `${spot.drive} · ${spot.heading}°`);
        addSpotStat("Projection", spot.projection);
      }
      const elevation = addSpotStat("MOLA elevation", "loading…");
      const galeDistance = surfaceDistance(
        Cesium.Cartesian3.fromDegrees(GALE.lon, GALE.lat, 0, MARS),
        Cesium.Cartesian3.fromDegrees(spot.lon, spot.lat, 0, MARS));
      addSpotStat("From Gale landing", fmtDist(galeDistance));
      const hi = LAYERS.find((l) => l.name === "Gale HiRISE mosaic");
      const inside = hi.bounds && spot.lon >= hi.bounds[0] && spot.lon <= hi.bounds[2] && spot.lat >= hi.bounds[1] && spot.lat <= hi.bounds[3];
      addSpotStat("HiRISE coverage", inside ? "Gale mosaic" : "outside Gale mosaic");
      spotCard.hidden = false;
      const cameraHeight = spot.category === "Panorama" ? 6000
        : spot.id === "gale-boxwork" || spot.id === "curiosity" ? 18000 : 350000;
      flyToSpot(spot.lon, spot.lat, cameraHeight);
      if (USE_PROXY) fetch(`./terrain/point?lat=${spot.lat}&lon=${spot.lon}`).then(r => r.ok ? r.json() : Promise.reject())
        .then(j => { if (spotStats.contains(elevation)) elevation.textContent = `${Math.round(j.height).toLocaleString()} m`; })
        .catch(() => { if (spotStats.contains(elevation)) elevation.textContent = "unavailable"; });
      else elevation.textContent = "local server required";
    }

    // ---------------------------------------------------------------- distances
    const fmtDist = (m) =>
      m >= 100_000 ? `${Math.round(m / 1000).toLocaleString()} km`
      : m >= 1000 ? `${(m / 1000).toFixed(m >= 10_000 ? 0 : 1)} km`
      : `${Math.round(m)} m`;
    // Distance along Mars's surface (not straight through it) between two surface points.
    const geodesic = new Cesium.EllipsoidGeodesic(undefined, undefined, MARS);
    function surfaceDistance(a, b) {
      geodesic.setEndPoints(MARS.cartesianToCartographic(a), MARS.cartesianToCartographic(b));
      return geodesic.surfaceDistance;
    }

    const readout = document.getElementById("readout");
    const scaleLabel = document.getElementById("scaleLabel");
    const scaleBar = document.getElementById("scaleBar");
    const scaleDist = document.getElementById("scaleDist");
    const MAX_BAR_PX = 140;

    function updateMetrics() {
      const cam = viewer.camera;
      const c = cam.positionCartographic;
      const tiltNow = Math.round(90 + Cesium.Math.toDegrees(cam.pitch));
      readout.textContent =
        `lon ${Cesium.Math.toDegrees(c.longitude).toFixed(3)}  lat ${Cesium.Math.toDegrees(c.latitude).toFixed(3)}\n` +
        `altitude ${fmtDist(c.height)}  tilt ${tiltNow}°`;

      // Scale bar: measure 1 pixel near the bottom-middle of the screen (closest ground when
      // tilted), then round the bar to a 1/2/5 x 10^n length.
      const canvas = viewer.scene.canvas;
      const x = canvas.clientWidth / 2, y = canvas.clientHeight - 60;
      const p1 = surfaceAt(x, y), p2 = surfaceAt(x + 1, y);
      if (p1 && p2) {
        const perPx = surfaceDistance(p1, p2);
        const raw = perPx * MAX_BAR_PX;
        const pow = 10 ** Math.floor(Math.log10(raw));
        const nice = [5, 2, 1].map((k) => k * pow).find((v) => v <= raw);
        scaleBar.style.width = `${Math.max(1, nice / perPx)}px`;
        scaleLabel.textContent = fmtDist(nice);
      } else {
        scaleBar.style.width = "0px";
        scaleLabel.textContent = "–";
      }

      // How far away is what you're looking at: camera -> centre of screen (straight line),
      // and how wide the view is across the middle of the screen (along the surface).
      const centre = surfaceAt(canvas.clientWidth / 2, canvas.clientHeight / 2);
      const left = surfaceAt(0, canvas.clientHeight / 2);
      const right = surfaceAt(canvas.clientWidth - 1, canvas.clientHeight / 2);
      scaleDist.textContent =
        (centre ? `to centre ${fmtDist(Cesium.Cartesian3.distance(cam.positionWC, centre))}` : "to centre –") +
        (left && right ? `\nview width ${fmtDist(surfaceDistance(left, right))}` : "");
    }
    viewer.camera.percentageChanged = 0.001;
    viewer.camera.changed.addEventListener(updateMetrics);
    viewer.camera.moveEnd.addEventListener(updateMetrics);
    // keep the slider in sync after the user tilts by hand
    viewer.camera.moveEnd.addEventListener(() => {
      tiltDeg = Math.min(MAX_TILT, Math.max(0, Math.round(currentTilt())));
      showTilt(tiltDeg);
    });

    // ---------------------------------------------------------------- hand tilt
    // Mouse: hold BOTH left and right buttons and drag up/down. Cesium has no two-button chord,
    // so while both are down we switch Cesium's own mouse handling off and tilt ourselves.
    // Touch: Cesium's two-finger gesture already tilts (drag both fingers up/down); the clamp
    // below keeps it, and every other way of tilting, at MAX_TILT or less.
    const ssc = viewer.scene.screenSpaceCameraController;
    const canvasEl = viewer.scene.canvas;
    let chord = null; // { y, tilt } while both buttons are held

    // Rotate the camera around the point in the middle of the screen to `deg`, instantly.
    function tiltNow(deg) {
      const target = viewCentre();
      const range = Cesium.Cartesian3.distance(viewer.camera.positionWC, target);
      viewer.camera.lookAt(target, new Cesium.HeadingPitchRange(viewer.camera.heading, pitchFor(deg), range));
      viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY); // release so normal controls work again
    }

    // Pressing a second button while the first is held fires pointermove (not pointerdown),
    // so the chord can start from either event.
    function maybeStartChord(e) {
      if (chord || e.pointerType !== "mouse" || (e.buttons & 3) !== 3) return false;
      chord = { y: e.clientY, tilt: currentTilt() };
      ssc.enableInputs = false;
      try { canvasEl.setPointerCapture(e.pointerId); } catch {}
      return true;
    }
    canvasEl.addEventListener("pointerdown", maybeStartChord);
    canvasEl.addEventListener("pointermove", (e) => {
      if (maybeStartChord(e) || !chord) return;
      if ((e.buttons & 3) !== 3) return endChord();
      // drag up = tilt toward the horizon, 0.3° per pixel
      const deg = Math.min(MAX_TILT, Math.max(0, chord.tilt + (chord.y - e.clientY) * 0.3));
      tiltNow(deg);
      tiltDeg = Math.round(deg);
      showTilt(tiltDeg);
    });
    function endChord() {
      if (!chord) return;
      chord = null;
      ssc.enableInputs = true;
    }
    canvasEl.addEventListener("pointerup", (e) => { if ((e.buttons & 3) !== 3) endChord(); });
    canvasEl.addEventListener("pointercancel", endChord);
    canvasEl.addEventListener("contextmenu", (e) => e.preventDefault());

    // Hard limit: whatever tilted the camera (touch, Ctrl+drag, middle-drag), pull it back to MAX_TILT.
    viewer.scene.preRender.addEventListener(() => {
      if (currentTilt() > MAX_TILT + 0.5) tiltNow(MAX_TILT);
    });
    window.addEventListener("resize", updateMetrics);

    // Elevation of the ground under the mouse (MOLA, metres above the areoid). Picked positions
    // are drawn exaggerated, so divide the exaggeration back out.
    const groundEl = document.getElementById("ground");
    const hover = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    hover.setInputAction((m) => {
      if (!terrainReady || !reliefBox.checked) { groundEl.textContent = ""; return; }
      const p = globe.pick(viewer.camera.getPickRay(m.endPosition), viewer.scene);
      if (!p) { groundEl.textContent = ""; return; }
      const h = MARS.cartesianToCartographic(p).height / viewer.scene.verticalExaggeration;
      groundEl.textContent = `ground under cursor ${Math.round(h).toLocaleString()} m`;
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);
    updateMetrics();

    // ---------------------------------------------------------------- click a point: pixel values
    // Click the map: a box pinned above that spot lists "layer name: value" for every layer in
    // the stack (hidden ones greyed). Values are the 8-bit pixel of the Trek tile under the
    // point, at the detail level you are viewing (or the layer's deepest, if shallower):
    // grey layers (albedo, hillshade, THEMIS…) give 0-255, colour layers give RGB + hex.
    // Trek tiles are display images, so these are brightness/colour, not calibrated units; the
    // first line is real elevation in metres from the MOLA data behind 3D relief.
    const probeEl = document.getElementById("probe");
    const markerEl = document.getElementById("marker");
    const occluder = new Cesium.EllipsoidalOccluder(MARS, Cesium.Cartesian3.ZERO);
    let probe = null; // { world, surface, lat, lon, lines }
    const tilePixels = new Map(); // tile url -> Promise<ImageData | null>, last ~60 kept

    function tileImage(url) {
      if (tilePixels.has(url)) return tilePixels.get(url);
      const job = fetch(url)
        .then((r) => (r.ok && (r.headers.get("content-type") ?? "").startsWith("image/") ? r.blob() : null))
        .then(async (blob) => {
          if (!blob) return null;
          const bmp = await createImageBitmap(blob);
          const c = new OffscreenCanvas(bmp.width, bmp.height);
          const g = c.getContext("2d", { willReadFrequently: true });
          g.drawImage(bmp, 0, 0);
          return g.getImageData(0, 0, bmp.width, bmp.height);
        })
        .catch(() => null);
      tilePixels.set(url, job);
      if (tilePixels.size > 60) tilePixels.delete(tilePixels.keys().next().value);
      return job;
    }

    // Trek level whose pixels are about the size of one screen pixel here.
    function levelForView(metresPerScreenPx) {
      const levelZeroMpp = (Math.PI * MARS.maximumRadius) / 256; // 180° over 256 px
      return Math.max(0, Math.ceil(Math.log2(levelZeroMpp / Math.max(metresPerScreenPx, 0.01))));
    }

    // { text, rgb?, level } for one layer at lat/lon, trying shallower levels if a tile is missing.
    async function samplePixel(def, lat, lon, wantLevel) {
      if (def.bounds) {
        const [w, s, e, n] = def.bounds;
        if (lon < w || lon > e || lat < s || lat > n) return { text: "outside coverage" };
      }
      const minL = def.minLevel ?? 0;
      for (let z = Math.max(minL, Math.min(def.maxLevel, wantLevel)); z >= minL; z--) {
        const deg = 180 / 2 ** z; // tile size in degrees
        const fx = (lon + 180) / deg, fy = (90 - lat) / deg;
        const col = Math.min(2 ** (z + 1) - 1, Math.floor(fx)), row = Math.min(2 ** z - 1, Math.floor(fy));
        const img = await tileImage(`${TILE_BASE}/Mars/EQ/${def.dataset}/1.0.0/default/default028mm/${z}/${row}/${col}.${def.ext}`);
        if (!img) continue;
        const px = Math.min(img.width - 1, Math.floor((fx - col) * img.width));
        const py = Math.min(img.height - 1, Math.floor((fy - row) * img.height));
        const i = (py * img.width + px) * 4;
        const [r, g, b, a] = img.data.slice(i, i + 4);
        if (a === 0) return { text: "no data", level: z };
        if (r === g && g === b) return { text: `${r} / 255`, rgb: [r, g, b], level: z };
        const hex = "#" + [r, g, b].map((v) => v.toString(16).padStart(2, "0")).join("");
        return { text: `RGB ${r}, ${g}, ${b}  ${hex}`, rgb: [r, g, b], level: z };
      }
      return { text: "no data" };
    }

    function renderProbe() {
      if (!probe) return;
      probeEl.replaceChildren();
      const top = document.createElement("div");
      top.className = "top";
      const where = document.createElement("span");
      const ns = probe.lat >= 0 ? "N" : "S", ew = probe.lon >= 0 ? "E" : "W";
      where.textContent = `${Math.abs(probe.lat).toFixed(4)}°${ns}  ${Math.abs(probe.lon).toFixed(4)}°${ew}`;
      const copy = button("copy", "Copy these values as text", () => {
        const text = [where.textContent, ...probe.lines.map((l) => `${l.name}: ${l.text}`)].join("\n");
        navigator.clipboard?.writeText(text).then(() => { copy.textContent = "copied"; }, () => {});
      });
      top.append(where, copy, button("✕", "Close", closeProbe));
      probeEl.append(top);
      for (const l of probe.lines) {
        const row = document.createElement("div");
        row.className = "row" + (l.off ? " off" : "");
        const k = document.createElement("span");
        k.className = "k";
        k.textContent = l.name;
        const v = document.createElement("span");
        v.className = "v";
        if (l.rgb) {
          const sw = document.createElement("span");
          sw.className = "sw";
          sw.style.background = `rgb(${l.rgb.join(",")})`;
          v.append(sw);
        }
        v.append(document.createTextNode(l.text));
        if (l.level !== undefined) {
          const lv = document.createElement("span");
          lv.className = "lvl";
          lv.textContent = `z${l.level}`;
          lv.title = `Read from tile level ${l.level}`;
          v.append(lv);
        }
        row.append(k, v);
        probeEl.append(row);
      }
      placeProbe();
    }

    // Keep the box over the clicked spot while the camera moves; hide it behind the planet.
    const screenPos = new Cesium.Cartesian2();
    function placeProbe() {
      if (!probe) return;
      occluder.cameraPosition = viewer.camera.positionWC;
      const p = Cesium.SceneTransforms.worldToWindowCoordinates(viewer.scene, probe.world, screenPos);
      const visible = p && occluder.isPointVisible(probe.surface);
      probeEl.hidden = markerEl.hidden = !visible;
      if (!visible) return;
      probeEl.style.left = markerEl.style.left = `${p.x}px`;
      probeEl.style.top = markerEl.style.top = `${p.y}px`;
    }
    viewer.scene.postRender.addEventListener(placeProbe);

    function placeSpotCard() {
      if (!selectedSpot) return;
      occluder.cameraPosition = viewer.camera.positionWC;
      const world = spotEntities.get(selectedSpot.id).position.getValue(Cesium.JulianDate.now());
      const p = Cesium.SceneTransforms.worldToWindowCoordinates(viewer.scene, world, screenPos);
      if (!p || !occluder.isPointVisible(world)) { spotCard.hidden = true; return; }
      spotCard.hidden = false;
      const half = spotCard.offsetWidth / 2;
      const x = Math.max(half + 8, Math.min(viewer.scene.canvas.clientWidth - half - 8, p.x));
      const y = Math.max(spotCard.offsetHeight + 24, p.y - 10);
      spotCard.style.left = `${x}px`;
      spotCard.style.top = `${y}px`;
    }
    viewer.scene.postRender.addEventListener(placeSpotCard);

    function closeProbe() {
      probe = null;
      probeEl.hidden = markerEl.hidden = true;
    }

    async function openProbe(screen) {
      selectedSpot = null;
      spotCard.hidden = true;
      for (const entity of spotEntities.values()) entity.label.show = false;
      for (const b of spotButtons.values()) b.classList.remove("active");
      const world = surfaceAt(screen.x, screen.y);
      if (!world) return closeProbe();
      const carto = MARS.cartesianToCartographic(world);
      const lat = Cesium.Math.toDegrees(carto.latitude), lon = Cesium.Math.toDegrees(carto.longitude);
      const next = surfaceAt(screen.x + 1, screen.y);
      const wantLevel = levelForView(next ? surfaceDistance(world, next) : 1000);
      const me = (probe = {
        world, lat, lon,
        surface: Cesium.Cartesian3.fromDegrees(lon, lat, 0, MARS),
        lines: [],
      });
      const elev = { name: "MOLA elevation", text: "…" };
      me.lines.push(elev);
      // top of the stack first, the same order as the panel
      const jobs = [...active].reverse().map((e) => {
        const line = { name: e.def.name, text: "…", off: !e.layer.show };
        me.lines.push(line);
        return samplePixel(e.def, lat, lon, wantLevel).then((s) => Object.assign(line, s));
      });
      if (USE_PROXY) {
        jobs.push(fetch(`./terrain/point?lat=${lat}&lon=${lon}`)
          .then((r) => (r.ok ? r.json() : Promise.reject()))
          .then((j) => { elev.text = `${j.height.toLocaleString()} m`; elev.level = undefined; elev.res = j.ppd; })
          .catch(() => { elev.text = "unavailable"; }));
      } else elev.text = "needs local server";
      renderProbe();
      for (const j of jobs) j.then(() => { if (probe === me) renderProbe(); });
    }

    // A click (press + release without dragging) probes; dragging still pans the globe.
    const clicker = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    clicker.setInputAction((e) => {
      const picked = spotsVisible ? viewer.scene.drillPick(e.position, 8) : [];
      const id = picked.map((p) => p?.id?.properties?.spotId?.getValue?.(Cesium.JulianDate.now())).find(Boolean);
      const spot = SPOTS.find((s) => s.id === id);
      if (spot) selectSpot(spot);
      else openProbe(e.position);
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
    clicker.setInputAction((e) => {
      const picked = spotsVisible && viewer.scene.pick(e.endPosition);
      viewer.scene.canvas.style.cursor = picked?.id?.properties?.spotId ? "pointer" : "";
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && probe) closeProbe(); });

    // ---------------------------------------------------------------- cache info
    const cacheInfo = document.getElementById("cacheInfo");
    async function updateCacheInfo() {
      if (!SW_OK || !window.caches) { cacheInfo.textContent = "browser cache off (needs http://localhost)"; return; }
      try {
        const n = (await (await caches.open("mars-tiles-v1")).keys()).length;
        const est = navigator.storage?.estimate ? await navigator.storage.estimate() : null;
        cacheInfo.textContent = `${n.toLocaleString()} tiles` +
          (est ? ` · ${(est.usage / 1e6).toFixed(1)} MB` : "") + (USE_PROXY ? " · + disk cache" : "");
      } catch { cacheInfo.textContent = "unavailable"; }
    }
    document.getElementById("btnClear").addEventListener("click", async () => {
      await caches.delete("mars-tiles-v1").catch(() => {});
      updateCacheInfo();
    });
    setInterval(updateCacheInfo, 5000);
    updateCacheInfo();

    // Tile loading progress, because Trek can take several seconds per tile.
    globe.tileLoadProgressEvent.addEventListener((queued) => {
      if (failed) return;
      statusEl.textContent = queued > 0
        ? `Loading Mars tiles… ${queued} left${USE_PROXY ? "" : " (direct from NASA Trek, slow)"}`
        : "";
    });

    // Acceptance test for step 1: the page flies to Gale on its own, but only once the whole
    // planet has painted (or after 10 s). Flying earlier cancels the global tiles and leaves a
    // bare brown ball.
    let flown = false;
    const goGale = () => {
      if (flown) return;
      flown = true;
      const entrySpot = SPOTS.find((spot) => spot.id === "gale-boxwork");
      if (entrySpot) selectSpot(entrySpot);
    };
    const onLoaded = (queued) => {
      if (queued === 0 && globe.tilesLoaded) {
        globe.tileLoadProgressEvent.removeEventListener(onLoaded);
        setTimeout(goGale, 1500);
      }
    };
    globe.tileLoadProgressEvent.addEventListener(onLoaded);
    setTimeout(goGale, 10_000);
  })();
  </script>
</body>
</html>
