[package]
name = "mars-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20"

# Faster dev builds: light optimisation for our own code, full optimisation
# for dependencies (Bevy), which are compiled once and then cached.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
